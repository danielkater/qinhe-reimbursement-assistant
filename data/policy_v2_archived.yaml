# 已废止的旧版制度（节选）。保留它是为了演示：系统只用"有效"版本作答，旧口径不会被引用。
name: 青禾公司差旅与报销制度
version: V2.1
status: 已废止
effective_date: 2025-01-01
clauses:
  - id: 第2条
    title: 住宿标准
    text: 一线城市每人每晚不超过500元，其他城市每人每晚不超过300元。
    keywords: [住宿, 酒店]
  - id: 第8条
    title: 报销时限
    text: 员工应在费用发生之日起60个自然日内提交报销。
    keywords: [时限]
